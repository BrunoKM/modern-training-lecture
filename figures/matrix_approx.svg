<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Latin+Modern+Roman:wght@400;700');
      text { font-family: 'Latin Modern Roman', 'CMU Serif', 'Computer Modern', 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- ========== ROW 1: BLOCK DIAGONAL ========== -->

  <!-- Dense matrix A (left) -->
  <g transform="translate(20, 28)">
    <text x="60" y="-6" text-anchor="middle" font-size="17" fill="#222" font-style="italic">A</text>
    <path d="M 0,0 Q -6,0 -6,6 L -6,114 Q -6,120 0,120" fill="none" stroke="#222" stroke-width="2"/>
    <path d="M 120,0 Q 126,0 126,6 L 126,114 Q 126,120 120,120" fill="none" stroke="#222" stroke-width="2"/>
    <rect x="2" y="2" width="116" height="116" rx="2" fill="#3b4d7a" opacity="0.88"/>
    <g stroke="#fff" stroke-width="0.3" opacity="0.35">
      <line x1="2" y1="14" x2="118" y2="14"/><line x1="2" y1="26" x2="118" y2="26"/>
      <line x1="2" y1="38" x2="118" y2="38"/><line x1="2" y1="50" x2="118" y2="50"/>
      <line x1="2" y1="62" x2="118" y2="62"/><line x1="2" y1="74" x2="118" y2="74"/>
      <line x1="2" y1="86" x2="118" y2="86"/><line x1="2" y1="98" x2="118" y2="98"/>
      <line x1="2" y1="110" x2="118" y2="110"/>
      <line x1="14" y1="2" x2="14" y2="118"/><line x1="26" y1="2" x2="26" y2="118"/>
      <line x1="38" y1="2" x2="38" y2="118"/><line x1="50" y1="2" x2="50" y2="118"/>
      <line x1="62" y1="2" x2="62" y2="118"/><line x1="74" y1="2" x2="74" y2="118"/>
      <line x1="86" y1="2" x2="86" y2="118"/><line x1="98" y1="2" x2="98" y2="118"/>
      <line x1="110" y1="2" x2="110" y2="118"/>
    </g>
  </g>

  <!-- ≈ sign -->
  <g transform="translate(168, 78)">
    <text x="0" y="12" text-anchor="middle" font-size="26" fill="#222">≈</text>
  </g>

  <!-- Block diagonal matrix B -->
  <g transform="translate(200, 28)">
    <text x="60" y="-6" text-anchor="middle" font-size="17" fill="#222" font-style="italic">B</text>
    <path d="M 0,0 Q -6,0 -6,6 L -6,114 Q -6,120 0,120" fill="none" stroke="#222" stroke-width="2"/>
    <path d="M 120,0 Q 126,0 126,6 L 126,114 Q 126,120 120,120" fill="none" stroke="#222" stroke-width="2"/>
    <rect x="2" y="2" width="116" height="116" rx="2" fill="#e8ecf2" opacity="0.6"/>
    <!-- Block 1 -->
    <rect x="2" y="2" width="50" height="50" rx="1.5" fill="#5b7fbf" opacity="0.85"/>
    <g stroke="#fff" stroke-width="0.3" opacity="0.4">
      <line x1="2" y1="12" x2="52" y2="12"/><line x1="2" y1="22" x2="52" y2="22"/>
      <line x1="2" y1="32" x2="52" y2="32"/><line x1="2" y1="42" x2="52" y2="42"/>
      <line x1="12" y1="2" x2="12" y2="52"/><line x1="22" y1="2" x2="22" y2="52"/>
      <line x1="32" y1="2" x2="32" y2="52"/><line x1="42" y1="2" x2="42" y2="52"/>
    </g>
    <!-- Block 2 -->
    <rect x="54" y="54" width="34" height="34" rx="1.5" fill="#5b7fbf" opacity="0.85"/>
    <g stroke="#fff" stroke-width="0.3" opacity="0.4">
      <line x1="54" y1="65" x2="88" y2="65"/><line x1="54" y1="76" x2="88" y2="76"/>
      <line x1="65" y1="54" x2="65" y2="88"/><line x1="76" y1="54" x2="76" y2="88"/>
    </g>
    <!-- Block 3 -->
    <rect x="90" y="90" width="28" height="28" rx="1.5" fill="#5b7fbf" opacity="0.85"/>
    <g stroke="#fff" stroke-width="0.3" opacity="0.4">
      <line x1="90" y1="99" x2="118" y2="99"/><line x1="90" y1="108" x2="118" y2="108"/>
      <line x1="99" y1="90" x2="99" y2="118"/><line x1="108" y1="90" x2="108" y2="118"/>
    </g>
    <!-- Zero markers -->
    <text x="85" y="30" text-anchor="middle" font-size="14" fill="#aab5cc" font-style="italic">0</text>
    <text x="30" y="100" text-anchor="middle" font-size="14" fill="#aab5cc" font-style="italic">0</text>
    <!-- Title below matrix -->
    <text x="60" y="140" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">Block diagonal</text>
  </g>

  <!-- ========== KRONECKER-FACTORED (right of row 1) ========== -->

  <!-- Kronecker-factored title and detail -->
  <text x="375" y="18" font-size="15" fill="#222" font-weight="bold">Kronecker-factored</text>
  <text x="375" y="38" font-size="14" fill="#333">each block:</text>

  <!-- Block k illustration: block = A_k ⊗ B_k -->
  <g transform="translate(375, 50)">
    <!-- Small filled block (width=36, right edge=36) -->
    <rect x="0" y="0" width="36" height="36" rx="2" fill="#5b7fbf" opacity="0.85"/>
    <g stroke="#fff" stroke-width="0.3" opacity="0.4">
      <line x1="0" y1="9" x2="36" y2="9"/><line x1="0" y1="18" x2="36" y2="18"/>
      <line x1="0" y1="27" x2="36" y2="27"/>
      <line x1="9" y1="0" x2="9" y2="36"/><line x1="18" y1="0" x2="18" y2="36"/>
      <line x1="27" y1="0" x2="27" y2="36"/>
    </g>

    <!-- = -->
    <text x="48" y="22" font-size="18" fill="#222">=</text>

    <!-- A_k: left edge=66, width=22, right edge=88 -->
    <g transform="translate(66, 4)">
      <rect x="0" y="0" width="22" height="22" rx="1.5" fill="#e8774a" opacity="0.85"/>
      <g stroke="#fff" stroke-width="0.3" opacity="0.4">
        <line x1="0" y1="11" x2="22" y2="11"/>
        <line x1="11" y1="0" x2="11" y2="22"/>
      </g>
      <text x="11" y="42" text-anchor="middle" font-size="12" fill="#333" font-style="italic">A<tspan font-size="9" dy="3">k</tspan></text>
    </g>

    <!-- ⊗ centered: A_k right=88, B_k left=122, midpoint=105 -->
    <text x="105" y="22" text-anchor="middle" font-size="18" fill="#222">⊗</text>

    <!-- B_k: left edge=122, width=30 -->
    <g transform="translate(122, 0)">
      <rect x="0" y="0" width="30" height="30" rx="1.5" fill="#2ecc71" opacity="0.7"/>
      <g stroke="#fff" stroke-width="0.3" opacity="0.4">
        <line x1="0" y1="10" x2="30" y2="10"/><line x1="0" y1="20" x2="30" y2="20"/>
        <line x1="10" y1="0" x2="10" y2="30"/><line x1="20" y1="0" x2="20" y2="30"/>
      </g>
      <text x="15" y="48" text-anchor="middle" font-size="12" fill="#333" font-style="italic">B<tspan font-size="9" dy="3">k</tspan></text>
    </g>
  </g>

  <!-- Kronecker param count -->
  <g transform="translate(375, 120)">
    <text x="0" y="14" font-size="13" fill="#777">
      <tspan font-style="italic">Σ</tspan><tspan font-size="11" dy="3">k</tspan><tspan dy="-3"> (</tspan><tspan font-style="italic">m</tspan><tspan font-size="10" dy="3">k</tspan><tspan font-size="13" dy="-3">² + </tspan><tspan font-style="italic">n</tspan><tspan font-size="10" dy="3">k</tspan><tspan font-size="13" dy="-3">²) parameters</tspan>
    </text>
  </g>

  <!-- ===== Separator line ===== -->
  <line x1="30" y1="210" x2="1070" y2="210" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ========== ROW 2: DIAGONAL ========== -->

  <!-- Dense matrix A (bottom left) -->
  <g transform="translate(20, 248)">
    <text x="60" y="-6" text-anchor="middle" font-size="17" fill="#222" font-style="italic">A</text>
    <path d="M 0,0 Q -6,0 -6,6 L -6,114 Q -6,120 0,120" fill="none" stroke="#222" stroke-width="2"/>
    <path d="M 120,0 Q 126,0 126,6 L 126,114 Q 126,120 120,120" fill="none" stroke="#222" stroke-width="2"/>
    <rect x="2" y="2" width="116" height="116" rx="2" fill="#3b4d7a" opacity="0.88"/>
    <g stroke="#fff" stroke-width="0.3" opacity="0.35">
      <line x1="2" y1="14" x2="118" y2="14"/><line x1="2" y1="26" x2="118" y2="26"/>
      <line x1="2" y1="38" x2="118" y2="38"/><line x1="2" y1="50" x2="118" y2="50"/>
      <line x1="2" y1="62" x2="118" y2="62"/><line x1="2" y1="74" x2="118" y2="74"/>
      <line x1="2" y1="86" x2="118" y2="86"/><line x1="2" y1="98" x2="118" y2="98"/>
      <line x1="2" y1="110" x2="118" y2="110"/>
      <line x1="14" y1="2" x2="14" y2="118"/><line x1="26" y1="2" x2="26" y2="118"/>
      <line x1="38" y1="2" x2="38" y2="118"/><line x1="50" y1="2" x2="50" y2="118"/>
      <line x1="62" y1="2" x2="62" y2="118"/><line x1="74" y1="2" x2="74" y2="118"/>
      <line x1="86" y1="2" x2="86" y2="118"/><line x1="98" y1="2" x2="98" y2="118"/>
      <line x1="110" y1="2" x2="110" y2="118"/>
    </g>
  </g>

  <!-- ≈ sign -->
  <g transform="translate(168, 298)">
    <text x="0" y="12" text-anchor="middle" font-size="26" fill="#222">≈</text>
  </g>

  <!-- Diagonal matrix D -->
  <g transform="translate(200, 248)">
    <text x="60" y="-6" text-anchor="middle" font-size="17" fill="#222" font-style="italic">D</text>
    <path d="M 0,0 Q -6,0 -6,6 L -6,114 Q -6,120 0,120" fill="none" stroke="#222" stroke-width="2"/>
    <path d="M 120,0 Q 126,0 126,6 L 126,114 Q 126,120 120,120" fill="none" stroke="#222" stroke-width="2"/>
    <rect x="2" y="2" width="116" height="116" rx="2" fill="#e8ecf2" opacity="0.6"/>
    <g fill="#c0392b" opacity="0.9">
      <rect x="2" y="2" width="11" height="11" rx="1"/>
      <rect x="14" y="14" width="11" height="11" rx="1"/>
      <rect x="26" y="26" width="11" height="11" rx="1"/>
      <rect x="38" y="38" width="11" height="11" rx="1"/>
      <rect x="50" y="50" width="11" height="11" rx="1"/>
      <rect x="62" y="62" width="11" height="11" rx="1"/>
      <rect x="74" y="74" width="11" height="11" rx="1"/>
      <rect x="86" y="86" width="11" height="11" rx="1"/>
      <rect x="98" y="98" width="11" height="11" rx="1"/>
      <rect x="107" y="107" width="11" height="11" rx="1"/>
    </g>
    <text x="90" y="30" text-anchor="middle" font-size="14" fill="#aab5cc" font-style="italic">0</text>
    <text x="30" y="105" text-anchor="middle" font-size="14" fill="#aab5cc" font-style="italic">0</text>
    <!-- Title below matrix -->
    <text x="60" y="140" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">Diagonal</text>
  </g>

  <!-- Diagonal structure: D = diag(a_1, a_2, …, a_d) -->
  <g transform="translate(375, 248)">
    <g transform="translate(0, 14)">
      <text x="0" y="18" font-size="15" fill="#222"><tspan font-style="italic">D</tspan> = diag(<tspan font-style="italic" fill="#c0392b">a</tspan><tspan font-size="10" fill="#c0392b" dy="3">1</tspan><tspan dy="-3">, </tspan><tspan font-style="italic" fill="#c0392b">a</tspan><tspan font-size="10" fill="#c0392b" dy="3">2</tspan><tspan dy="-3">, … , </tspan><tspan font-style="italic" fill="#c0392b">a</tspan><tspan font-size="10" fill="#c0392b" dy="3" font-style="italic">d</tspan><tspan dy="-3">)</tspan></text>
    </g>

    <g transform="translate(0, 66)">
      <text x="0" y="16" font-size="13" fill="#777"><tspan font-style="italic">d</tspan> parameters</text>
    </g>
  </g>

  <!-- ===== Legend / Color Key ===== -->
  <g transform="translate(700, 50)">
    <text x="0" y="0" font-size="15" fill="#222" font-weight="bold">Legend</text>
    <rect x="0" y="14" width="16" height="16" rx="2" fill="#3b4d7a" opacity="0.88"/>
    <text x="24" y="27" font-size="13" fill="#444">Dense entries</text>
    <rect x="0" y="38" width="16" height="16" rx="2" fill="#5b7fbf" opacity="0.85"/>
    <text x="24" y="51" font-size="13" fill="#444">Block (Kronecker) entries</text>
    <rect x="0" y="62" width="16" height="16" rx="2" fill="#e8774a" opacity="0.85"/>
    <text x="24" y="75" font-size="13" fill="#444">Kronecker factor <tspan font-style="italic">A<tspan font-size="10" dy="2">k</tspan></tspan></text>
    <rect x="0" y="86" width="16" height="16" rx="2" fill="#2ecc71" opacity="0.7"/>
    <text x="24" y="99" font-size="13" fill="#444">Kronecker factor <tspan font-style="italic" dy="-2">B<tspan font-size="10" dy="2">k</tspan></tspan></text>
    <rect x="0" y="110" width="16" height="16" rx="2" fill="#c0392b" opacity="0.9"/>
    <text x="24" y="123" font-size="13" fill="#444">Diagonal entries</text>
    <rect x="0" y="134" width="16" height="16" rx="2" fill="#e8ecf2" opacity="0.6" stroke="#ccc" stroke-width="0.5"/>
    <text x="24" y="147" font-size="13" fill="#444">Zero</text>
  </g>

</svg>
